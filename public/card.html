<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save the Date | Tarunima &amp; Subhayu #DoRiTales</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&amp;family=Outfit:wght@400;600;700&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #FAF5EF;
      font-family: 'Outfit', sans-serif;
      color: #2B2625;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background: #FFFDF9;
      border: 2px solid #E07A5F;
      border-radius: 28px;
      padding: 3rem 2rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(224, 122, 95, 0.15);
    }
    .save-tag {
      font-size: 0.85rem;
      letter-spacing: 3px;
      font-weight: 700;
      color: #E07A5F;
      margin-bottom: 1rem;
      text-transform: uppercase;
    }
    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 2.8rem;
      font-weight: 700;
      color: #2B2625;
      margin-bottom: 0.3rem;
    }
    .hashtag {
      font-size: 1.2rem;
      color: #F4A261;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }
    .details {
      background: #FDEEDC;
      border-radius: 16px;
      padding: 1rem;
      margin-bottom: 2rem;
      font-size: 1.05rem;
    }
    .details strong { color: #E07A5F; display: block; margin-bottom: 0.2rem; }
    .qr-box {
      background: #FFF;
      border: 2px solid #F4A261;
      border-radius: 20px;
      padding: 1.2rem;
      display: inline-block;
      margin-bottom: 1.5rem;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
    }
    .qr-box img { width: 240px; height: 240px; display: block; }
    .footer-note { font-size: 0.95rem; color: #5C5452; }
    .link-btn {
      display: inline-block;
      margin-top: 1rem;
      background: linear-gradient(135deg, #E07A5F, #F4A261);
      color: #FFF;
      padding: 0.8rem 1.8rem;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="save-tag">✨ Save the Date ✨</div>
    <h1>Tarunima &amp; Subhayu</h1>
    <div class="hashtag">#DoRiTales</div>

    <div class="details">
      <strong>November 12 &amp; 13, 2026</strong>
      San Jose / South Bay Area, CA<br>
      <small style="color:#5C5452;">Formal Invitation to Follow</small>
    </div>

    <div class="qr-box">
      <img src="./images/real_qr_code.png" alt="Scan QR Code for Website">
    </div>

    <p class="footer-note">Scan with camera to visit our website for updates &amp; travel info!</p>
    <a href="https://ten5.github.io/wedding-planning/#v1" class="link-btn">Visit Website Live 🌐</a>
  </div>
</body>
</html>
